services:
  - type: web
    name: buffett-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CACHE_EXPIRE
        value: 3600
      - key: MAX_SYMBOLS
        value: 10
      - key: MAX_REQUESTS_PER_MINUTE
        value: 10
      - key: MIN_DELAY_SECONDS
        value: 0.5
    healthCheckPath: /health
    autoDeploy: true
